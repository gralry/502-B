<!DOCTYPE html>
<html lang="es">

    <head>

    </head>

    <body>

        <main>

            <h1>Evento de ingeniería 2026</h1>

            <p>
                Registro de participantes
            </p>

            <form action="#" method="get">
                <input type="hidden" name="evento"
                value="ingeniería-innovacion-2026">
                <fieldset>

                    <legend>Datos personales</legend>
    
                    <label for="nombre">
                        Nombre completo
                    </label>
    
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" minlength="3" maxlength="80"
                        required>
    
    
                    <label for="correo">
                        Correo electrónico
                    </label>
    
                    <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
    
    
                    <label for="password">
                        Contraseña
                    </label>
                    <input type="password" id="password" name="password" minlength="8" required>
    
                </fieldset>

            <button type="submit">
                Registrar participación
            </button>


            </form>
        </main>
    </body>

</html>
