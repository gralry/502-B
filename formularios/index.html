<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - Ingeniería e Innovación 2026</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <main>
        <h1>Evento de ingeniería 2026</h1>
        <p>  Registro de participantes
        </p>
        <form action="#" method="get">Anonymous
            <input type="hidden" name="evento" value="ingenieria-innovacion-2026">
            <fieldset>
                <legend>Datos personales</legend>
                <label for="nombre">
                    Nombre completo
                </label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" minlength="3" maxlength="80"
                    required>
                <label for="correo">
                    Correo electrónico
                </label>
                <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
                <label for="password">
                    Contraseña
                </label>
                <input type="password" id="password" name="password" minlength="8" required>
            </fieldset>

            <fieldset>
                <legend>Información académica</legend>
                <label for="matricula">
                    Matrícula
                </label>
                <input type="text" id="matricula" name="matricula" required>
                <label for="carrera">
                    Carrera
                </label>

                <select id="carrera" name="carrera" required>
                    <option value="">
                        Seleccione una carrera
                    </option>
                    <option value="computacion">
                        Ingeniería en Computación
                    </option>
                    <option value="electronica">
                        Ingeniería Electrónica
                    </option>
                    <option value="mecatronica">
                        Ingeniería Mecatrónica
                    </option>
                    <option value="industrial">
                        Ingeniería Industrial
                    </option>
                </select>

                <label for="semestre">
                    Semestre
                </label>
                <input type="number" id="semestre" name="semestre" min="1" max="12" required>
            </fieldset>

            <fieldset>
                <legend>Participación</legend>
                <p>Modalidad:</p>
                <label>
                    <input type="radio" name="modalidad" value="presencial" required>
                    Presencial
                </label>
                <label>
                    <input type="radio" name="modalidad" value="virtual">
                    Virtual
                </label>
                <p>Áreas de interés:</p>
                <label>
                    <input type="checkbox" name="intereses" value="ia">
                    Inteligencia Artificial
                </label>
                <label>
                    <input type="checkbox" name="intereses" value="web">
                    Desarrollo Web
                </label>
                <label>
                    <input type="checkbox" name="intereses" value="robotica">
                    Robótica
                </label>
            </fieldset>

            <fieldset>
                <legend>Información adicional</legend>
                <label for="fecha">
                    Fecha de nacimiento
                </label>
                <input type="date" id="fecha" name="fecha">

                <label for="archivo">
                    Identificación
                </label>
                <input type="file" id="archivo" name="archivo" accept=".pdf,.jpg,.png">
                <label for="comentarios">
                    Comentarios
                </label>
                <textarea id="comentarios" name="comentarios" rows="5" maxlength="300"
                    placeholder="Escriba sus comentarios"></textarea>
            </fieldset>

            <label>
                <input type="checkbox" name="terminos" required>
                Acepto los términos y condiciones.
            </label>

            <button type="submit">
                Registrar participación
            </button>
        </form>
    </main>
</body>
</html>
